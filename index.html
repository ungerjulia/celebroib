<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELEBRO — Central de Agentes Especializados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --harbor:#0C1A26;--harbor-2:#0F2130;--panel:#132A3B;--panel-2:#173347;
    --line:#22485F;--line-soft:#1B3A4E;
    --ice:#2FB8CE;--ice-dim:#1c7f90;--amber:#E8A13A;--green:#48B47C;--red:#E0685E;--violet:#9C7BE6;
    --ink:#E9F1F6;--ink-2:#9DB4C4;--ink-3:#6F8B9E;
    --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;--display:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 82% -10%,#123043 0%,transparent 55%),var(--harbor);color:var(--ink);font-family:var(--sans);line-height:1.45;min-height:100vh}
  @media (prefers-reduced-motion:no-preference){
    .fade{opacity:0;transform:translateY(6px);animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards}
    .fade.d1{animation-delay:.05s}.fade.d2{animation-delay:.12s}.fade.d3{animation-delay:.19s}
    @keyframes rise{to{opacity:1;transform:none}}
  }
  .app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}

  /* ---------- RAIL ---------- */
  .rail{border-right:1px solid var(--line);background:linear-gradient(180deg,var(--harbor-2),var(--harbor));padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 6px 6px}
  /* selo IB — SUBSTITUIR pela logo oficial (troque este bloco .ib pelo <img> da logo) */
  .ib{width:46px;height:46px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(135deg,#1b4a5e,#0e2c3a);border:1px solid var(--ice-dim);
    font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em;color:var(--ice);
    box-shadow:0 0 20px rgba(47,184,206,.18)}
  .brand .cel{display:flex;align-items:center;gap:8px}
  .brand .name{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.11em;color:var(--ink)}
  .brand .name b{color:var(--ice)}
  .brand .tag{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;margin-top:2px}
  .neuro{filter:drop-shadow(0 0 6px rgba(47,184,206,.5))}

  .market{width:100%;margin:16px 0 6px;padding:13px 14px;border-radius:12px;cursor:pointer;text-align:left;
    background:linear-gradient(120deg,rgba(156,123,230,.18),rgba(47,184,206,.14));
    border:1px solid #4a5f7e;color:var(--ink);display:flex;align-items:center;gap:11px;
    font-family:var(--display);font-weight:600;font-size:14px;transition:.15s;position:relative;overflow:hidden}
  .market:hover{border-color:var(--violet);transform:translateY(-1px)}
  .market.on{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 6px 22px rgba(156,123,230,.22)}
  .market .ico{width:26px;height:26px;flex:0 0 auto}
  .market .sig{position:absolute;top:9px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--violet)}
  @media (prefers-reduced-motion:no-preference){.market .sig{animation:beat 2.4s infinite}}

  .rail h6{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);font-weight:600;padding:16px 10px 8px;text-transform:uppercase}
  .sector{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--ink-2);
    font-family:var(--sans);font-size:13.5px;font-weight:500;padding:10px 12px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;gap:11px;transition:.15s;margin-bottom:2px}
  .sector:hover{background:var(--panel);color:var(--ink)}
  .sector.on{background:linear-gradient(90deg,rgba(47,184,206,.14),transparent);border-color:var(--ice-dim);color:var(--ink)}
  .sector .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--ink-3)}
  .sector.on .dot{background:var(--ice);box-shadow:0 0 10px var(--ice)}
  .sector .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}

  .intake{width:100%;margin-top:10px;text-align:left;background:var(--panel);border:1px solid var(--line-soft);
    color:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:500;padding:12px;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;gap:10px;transition:.15s}
  .intake:hover{border-color:var(--ice-dim);color:var(--ink)}
  .intake.on{border-color:var(--ice);color:var(--ink)}
  .intake .ico{width:20px;height:20px;flex:0 0 auto;color:var(--ice)}

  .rail .foot{margin-top:20px;padding:12px 10px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-3)}
  .rail .foot b{color:var(--ink-2);font-weight:600}

  /* ---------- MAIN ---------- */
  .main{padding:22px 30px 60px;max-width:1240px}
  .topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
  .topbar .title{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:-.01em}
  .topbar .desc{color:var(--ink-2);font-size:13px;max-width:540px}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);padding:6px 11px;border-radius:99px;font-family:var(--mono)}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--green)}
  @media (prefers-reduced-motion:no-preference){.live .pulse{animation:beat 2.4s infinite}}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(72,180,124,.5)}70%{box-shadow:0 0 0 7px rgba(72,180,124,0)}100%{box-shadow:0 0 0 0 rgba(72,180,124,0)}}
  .proto{margin-left:auto;font-size:10.5px;color:var(--amber);border:1px dashed rgba(232,161,58,.5);padding:5px 10px;border-radius:7px;font-family:var(--mono)}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:15px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ice);opacity:.85}
  .kpi.warn::before{background:var(--amber)}.kpi.good::before{background:var(--green)}.kpi.bad::before{background:var(--red)}
  .kpi .lab{font-size:11px;color:var(--ink-2);line-height:1.3;min-height:28px}
  .kpi .val{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:8px}
  .kpi .val small{font-size:12px;color:var(--ink-2);font-weight:400;margin-left:3px}
  .kpi .delta{font-size:11px;margin-top:4px;font-family:var(--mono);display:flex;align-items:center;gap:5px}
  .kpi .delta.up{color:var(--green)}.kpi .delta.down{color:var(--red)}.kpi .delta.flat{color:var(--ink-3)}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:18px}
  .card .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .card h3{font-family:var(--display);font-size:15px;font-weight:600}
  .card .hint{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--ink-2);margin-top:10px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:3px;border-radius:2px;display:inline-block}

  .agents-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .agents-head h2{font-family:var(--display);font-size:17px;font-weight:600}
  .agents-head .ctx{font-size:12.5px;color:var(--ink-2)}
  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .chip{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-family:var(--sans);font-size:12px;padding:6px 12px;border-radius:99px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--ice-dim);color:var(--ink)}
  .chip.on{background:rgba(47,184,206,.12);border-color:var(--ice);color:var(--ink)}
  .agents{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .agent{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:20px 16px 18px;cursor:pointer;transition:.15s;text-align:center;position:relative}
  .agent:hover{border-color:var(--ice-dim);transform:translateY(-2px)}
  .agent .badge{position:absolute;top:12px;right:12px}
  .avatar{width:66px;height:66px;border-radius:50%;margin:0 auto 13px;display:grid;place-items:center;background:var(--harbor-2);border:2px solid var(--ac);box-shadow:0 6px 18px -8px var(--ac),inset 0 0 20px -14px var(--ac)}
  .agent .name{font-family:var(--display);font-size:14.5px;font-weight:600;line-height:1.25}
  .agent .fn{font-size:12px;color:var(--ink-2);margin-top:8px;min-height:48px;line-height:1.45}
  .stars{position:relative;display:inline-block;font-size:15px;letter-spacing:2px;margin-top:6px;line-height:1}
  .stars .bg{color:#2b4a5c}
  .stars .fg{position:absolute;left:0;top:0;color:#F2C14E;overflow:hidden;white-space:nowrap}
  .slabel{font-size:10px;color:var(--ink-3);font-family:var(--mono);margin-top:7px;letter-spacing:.04em}
  .badge{font-size:10px;font-weight:600;padding:4px 8px;border-radius:99px;white-space:nowrap}
  .badge.a{background:rgba(72,180,124,.14);color:#7fd6a5;border:1px solid rgba(72,180,124,.35)}
  .badge.b{background:rgba(232,161,58,.13);color:#f0bd6e;border:1px solid rgba(232,161,58,.32)}
  .badge.p{background:rgba(111,139,158,.12);color:var(--ink-2);border:1px solid var(--line)}
  .drow .stars{margin-top:0}
  .drawer .avatar{margin:0;width:52px;height:52px;flex:0 0 auto}
  .drawer h3{padding-right:0}

  /* ---------- MERCADO ---------- */
  .signals{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .sig-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:13px;padding:16px;border-left:3px solid var(--violet)}
  .sig-card.pos{border-left-color:var(--green)}.sig-card.neg{border-left-color:var(--red)}.sig-card.neu{border-left-color:var(--amber)}
  .sig-card .sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
  .sig-card h4{font-family:var(--display);font-size:14px;font-weight:600}
  .sig-card .imp{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:99px;white-space:nowrap}
  .imp.pos{background:rgba(72,180,124,.14);color:#7fd6a5}.imp.neg{background:rgba(224,104,94,.14);color:#eb968e}.imp.neu{background:rgba(232,161,58,.14);color:#f0bd6e}
  .sig-card p{font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .sig-card .src{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin-top:9px}

  /* ---------- MERCADO: abas + produtos + oferta ---------- */
  .mtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
  .mtab{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:13px;padding:9px 18px;border-radius:10px;cursor:pointer;transition:.15s}
  .mtab:hover{border-color:var(--violet);color:var(--ink)}
  .mtab.on{background:linear-gradient(120deg,rgba(156,123,230,.22),rgba(47,184,206,.12));border-color:var(--violet);color:var(--ink);box-shadow:0 4px 16px -8px var(--violet)}
  .prods{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .prod{background:var(--panel);border:1px solid var(--line-soft);border-radius:13px;padding:16px 14px;cursor:pointer;transition:.15s;position:relative}
  .prod:hover{border-color:var(--violet);transform:translateY(-3px);box-shadow:0 10px 26px -14px var(--violet)}
  .prod .pn{font-family:var(--display);font-size:13px;font-weight:600;line-height:1.3;min-height:34px}
  .prod .pp{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:10px;letter-spacing:-.02em}
  .prod .pt{font-family:var(--mono);font-size:11.5px;margin-top:3px}
  .prod .pt.up{color:var(--green)}.prod .pt.down{color:var(--red)}
  .prod .pgo{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--violet);font-family:var(--mono);letter-spacing:.03em}
  .ostep{display:flex;gap:12px;margin-top:16px}
  .ostep .on{width:26px;height:26px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:rgba(156,123,230,.16);border:1px solid var(--violet);color:#c3aef0;font-family:var(--mono);font-size:12px;font-weight:600}
  .ostep .ob{flex:1}
  .ostep h4{font-family:var(--display);font-size:13px;font-weight:600;margin:3px 0 8px}
  .ocard{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:12px 13px;font-size:12.5px;color:var(--ink-2)}
  .ocard b{color:var(--ink)}
  .orow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-family:var(--mono);font-size:11.5px}
  .orow span:first-child{color:var(--ink-3)}.orow span:last-child{color:var(--ink)}
  .clist .cl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:12px}
  .clist .cl:first-child{border-top:none}
  .clist .cl span:last-child{color:var(--ink-3);font-family:var(--mono);font-size:10.5px}
  .osuccess{background:rgba(72,180,124,.12);border:1px solid rgba(72,180,124,.4);border-radius:10px;padding:16px;text-align:center;color:#7fd6a5;font-family:var(--display);font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:5px}
  .osuccess span{color:var(--ink-3);font-family:var(--sans);font-weight:400;font-size:11.5px}

  /* ---------- INTAKE ---------- */
  .intake-grid{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
  .form{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:20px}
  .form h3{font-family:var(--display);font-size:15px;margin-bottom:4px}
  .form .sub{font-size:12px;color:var(--ink-3);margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
  .field select,.field textarea,.field input[type=text]{width:100%;background:var(--harbor-2);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:10px 12px;font-family:var(--sans);font-size:13px;resize:vertical}
  .field select:focus,.field textarea:focus,.field input:focus{outline:none;border-color:var(--ice)}
  .field textarea{min-height:82px}
  .drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:.15s;color:var(--ink-3);font-size:12.5px}
  .drop:hover{border-color:var(--ice-dim);color:var(--ink-2)}
  .drop b{color:var(--ice)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .fchip{display:inline-flex;align-items:center;gap:6px;background:var(--harbor-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11px;color:var(--ink-2);font-family:var(--mono)}
  .fchip b{color:var(--ice);cursor:pointer}
  .btn{width:100%;margin-top:6px;background:linear-gradient(120deg,var(--ice-dim),var(--ice));color:#04222b;border:none;
    font-family:var(--display);font-weight:600;font-size:14px;padding:12px;border-radius:10px;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.08)}
  .queue h3{font-family:var(--display);font-size:15px;margin-bottom:14px}
  .item{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:15px;margin-bottom:12px}
  .item .ih{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px}
  .item .kind{font-family:var(--display);font-size:13.5px;font-weight:600}
  .item .st{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:99px;white-space:nowrap;background:rgba(232,161,58,.14);color:#f0bd6e}
  .item .st.rev{background:rgba(47,184,206,.14);color:#8fdcea}.item .st.done{background:rgba(72,180,124,.14);color:#7fd6a5}
  .item p{font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .item .im{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
  .item .im .att{color:var(--ice)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(6,14,20,.6);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:30}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,92vw);background:var(--harbor-2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);z-index:40;padding:26px;overflow:auto}
  .drawer.on{transform:none}
  .drawer .x{position:absolute;top:18px;right:18px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
  .drawer h3{font-family:var(--display);font-size:20px;font-weight:600;padding-right:40px;margin-bottom:6px}
  .drawer .dfn{color:var(--ink-2);font-size:13.5px;margin-bottom:20px}
  .drow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft);font-size:13px}
  .drow .k{color:var(--ink-3)}.drow .v{color:var(--ink);text-align:right;font-family:var(--mono);font-size:12.5px}
  .dnote{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:14px;margin-top:18px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
  .dnote b{color:var(--ink)}

  @media(max-width:1080px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.signals,.intake-grid{grid-template-columns:1fr}.agents{grid-template-columns:repeat(2,1fr)}.prods{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:720px){.app{grid-template-columns:1fr}.rail{position:static;height:auto}.main{padding:18px}.kpis{grid-template-columns:repeat(2,1fr)}.agents{grid-template-columns:1fr}.prods{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand">
      <!-- ↓↓↓ SUBSTITUIR pelo <img src="logo-ib.svg"> oficial da IB ↓↓↓ -->
      <div class="ib">IB</div>
      <div>
        <div class="cel">
          <svg class="neuro" width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="6" cy="7" r="2" fill="#2FB8CE"/><circle cx="18" cy="6" r="2" fill="#2FB8CE"/>
            <circle cx="12" cy="13" r="2.3" fill="#2FB8CE"/><circle cx="7" cy="18" r="2" fill="#2FB8CE"/><circle cx="18" cy="17" r="2" fill="#2FB8CE"/>
            <path d="M6 7L12 13M18 6L12 13M12 13L7 18M12 13L18 17" stroke="#2FB8CE" stroke-width="1.1" opacity=".55"/>
          </svg>
          <span class="name">CE<b>L</b>EBRO</span>
        </div>
        <div class="tag">Central de Agentes Especializados</div>
      </div>
    </div>

    <button class="market on" data-view="market">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M3 17l5-5 4 3 6-8" stroke="#9C7BE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 4h4v4" stroke="#9C7BE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Inteligência de Mercado
      <span class="sig"></span>
    </button>

    <h6>Setores</h6>
    <div id="sectors"></div>

    <button class="intake" data-view="intake">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Acesso a Projetos e Inteligência
    </button>

    <div class="foot">Fonte: <b>Data Lake IB</b> (e-mails, drives)<br>+ planilhas e ERP/CRM<br><span style="color:var(--ink-3)">Itajaí · SC</span></div>
  </nav>

  {kind:'Ideia de novo agente',agent:'—',sector:'Operacional',desc:'Agente que cruza o booking com a capacidade do armador e sugere a melhor janela de embarque.',files:[],status:'open',when:'ontem 16:40'},
];
let pendingFiles=[];

let view='market', filter='all', mktCat='meat';

/* ---------- NAV ---------- */
function renderNav(){
  $('#sectors').innerHTML=SECTORS.map(s=>{
    const c=s.id==='overview'?AGENTS.length:AGENTS.filter(a=>a.s===s.id).length;
    return `<button class="sector ${s.id===view?'on':''}" data-view="${s.id}"><span class="dot"></span>${s.name}<span class="n">${c}</span></button>`;
  }).join('');
  document.querySelectorAll('.sector').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
  document.querySelectorAll('[data-view="market"],[data-view="intake"]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
  $('.market').classList.toggle('on',view==='market');
  $('.intake').classList.toggle('on',view==='intake');
}

/* ---------- KPI / CHARTS ---------- */
function kpiHTML(arr){return arr.map(k=>`<div class="kpi ${k.cls}"><div class="lab">${k.lab}</div><div class="val">${k.val}${k.unit?`<small>${k.unit}</small>`:''}</div><div class="delta ${k.dir}">${k.dir==='up'?'▲':k.dir==='down'?'▼':'■'} ${k.d}</div></div>`).join('');}

function lineSVG(data,labels,target,unitHint){
  const W=560,H=200,pl=34,pr=14,pt=16,pb=26;
  const all=target?[...data,target]:data;const max=Math.max(...all)+ (target?3:(Math.max(...all)*0.04)), min=Math.min(...all)-(target?3:(Math.max(...all)*0.04));
  const x=i=>pl+i*(W-pl-pr)/(data.length-1), y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  const path=data.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${path} L${x(data.length-1).toFixed(1)},${H-pb} L${x(0).toFixed(1)},${H-pb} Z`;
  let grid='';for(let g=0;g<4;g++){const gy=pt+g*(H-pt-pb)/3;grid+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="${C.line}" stroke-width="1"/>`;}
  const tline=target?`<line x1="${pl}" y1="${y(target).toFixed(1)}" x2="${W-pr}" y2="${y(target).toFixed(1)}" stroke="${C.amber}" stroke-width="1.4" stroke-dasharray="5 4"/>`:'';
  const dots=data.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="${C.harbor}" stroke="${C.ice}" stroke-width="2"/>`).join('');
  const labs=labels.map((l,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" fill="${C.ink3}" font-size="10" font-family="'IBM Plex Mono',monospace" text-anchor="middle">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.ice}" stop-opacity=".28"/><stop offset="1" stop-color="${C.ice}" stop-opacity="0"/></linearGradient></defs>${grid}${tline}<path d="${area}" fill="url(#lg)"/><path d="${path}" fill="none" stroke="${C.ice}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labs}</svg>`;
}
function barSVG(){
  const W=440,H=200,pl=90,pr=30,pt=8,pb=8,gap=12,max=Math.max(...BAR.map(b=>b.v)),bh=(H-pt-pb-gap*(BAR.length-1))/BAR.length;let o='';
  BAR.forEach((b,i)=>{const by=pt+i*(bh+gap),bw=(W-pl-pr)*(b.v/max);
    o+=`<text x="${pl-10}" y="${by+bh/2+4}" fill="${C.ink2}" font-size="11.5" text-anchor="end">${b.m}</text><rect x="${pl}" y="${by}" width="${W-pl-pr}" height="${bh}" rx="4" fill="${C.harbor2}"/><rect x="${pl}" y="${by}" width="${bw.toFixed(1)}" height="${bh}" rx="4" fill="${b.c}"/><text x="${pl+bw+8}" y="${by+bh/2+4}" fill="${C.ink}" font-size="11.5" font-family="'IBM Plex Mono',monospace">${b.v}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${o}</svg>`;
}

/* ---------- VIEWS ---------- */
function dashboardView(sec){
  return `<header class="topbar fade"><div><div class="title">${sec.title}</div><div class="desc">${sec.desc}</div></div>
    <span class="live"><span class="pulse"></span> operação ativa</span><span class="proto">protótipo · dados ilustrativos</span></header>
    <section class="kpis fade d1">${kpiHTML(KPIS)}</section>
    <section class="grid2 fade d2">
      <div class="card"><div class="head"><h3>Transit time médio — rota China</h3><span class="hint">dias · 8 meses</span></div>${lineSVG(LINE,LLAB,LTARGET)}
        <div class="legend"><span><i style="background:${C.ice}"></i> realizado</span><span><i style="background:${C.amber}"></i> meta (35 dias)</span></div></div>
      <div class="card"><div class="head"><h3>Volume exportado por mercado</h3><span class="hint">mil ton · ano</span></div>${barSVG()}</div>
    </section>
    <section class="fade d3"><div class="agents-head"><h2>Malha de Agentes</h2><span class="ctx" id="ctx"></span></div>
      <div class="filters"><button class="chip on" data-f="all">Todos</button><button class="chip" data-f="a">● Ativos</button><button class="chip" data-f="b">● Em desenvolvimento</button><button class="chip" data-f="p">● Planejados</button></div>
      <div class="agents" id="agents"></div></section>`;
}
function marketView(){
  const cat=MARKETCATS[mktCat];
  const tabs=Object.entries(MARKETCATS).map(([k,v])=>`<button class="mtab ${k===mktCat?'on':''}" data-cat="${k}">${v.label}</button>`).join('');
  const prods=cat.products.map((p,i)=>{const up=!p.trend.startsWith('-');return `<div class="prod" data-cat="${mktCat}" data-pi="${i}"><div class="pn">${p.name}</div><div class="pp">${p.price}</div><div class="pt ${up?'up':'down'}">${up?'▲':'▼'} ${p.trend}</div><div class="pgo">◆ gerar oferta</div></div>`;}).join('');
  return `<header class="topbar fade"><div><div class="title">Inteligência de Mercado</div><div class="desc">Preços e sinais por categoria. Clique num produto em alta para o agente buscar fornecedor, montar a oferta e disparar no CRM.</div></div>
    <span class="live"><span class="pulse" style="background:${C.violet}"></span> monitorando</span><span class="proto">protótipo · dados ilustrativos</span></header>
    <div class="mtabs fade">${tabs}</div>
    <section class="kpis fade d1">${kpiHTML(cat.kpis)}</section>
    <section class="grid2 fade d2">
      <div class="card"><div class="head"><h3>Tendência de preço</h3><span class="hint">${cat.lineLabel}</span></div>${lineSVG(cat.line,MLAB,null)}</div>
      <div class="card"><div class="head"><h3>Exposição por mercado</h3><span class="hint">mil ton · ano</span></div>${barSVG()}</div>
    </section>
    <section class="fade d3"><div class="agents-head"><h2>Produtos em alta — ${cat.label}</h2><span class="ctx">5 em alta · clique para gerar oferta</span></div>
      <div class="prods">${prods}</div></section>
    <section class="fade"><div class="agents-head"><h2>Sinais de mercado</h2><span class="ctx">${cat.signals.length} sinais</span></div>
      <div class="signals">${cat.signals.map(s=>`<div class="sig-card ${s.imp}"><div class="sh"><h4>${s.t}</h4><span class="imp ${s.imp}">${s.lab}</span></div><p>${s.p}</p><div class="src">◈ ${s.src}</div></div>`).join('')}</div></section>`;
}
function bindMarket(){
  document.querySelectorAll('.mtab').forEach(b=>b.onclick=()=>{mktCat=b.dataset.cat;render();});
  document.querySelectorAll('.prod').forEach(el=>el.onclick=()=>openOffer(el.dataset.cat,+el.dataset.pi));
}
function openOffer(catId,pi){
  const cat=MARKETCATS[catId],p=cat.products[pi],n=cat.clients.length;
  $('#drawerBody').innerHTML=`
    <div style="display:flex;align-items:center;gap:13px;margin-bottom:6px">${avatar('target',C.violet)}<div><span class="badge b" style="display:inline-block;margin-bottom:6px;background:rgba(156,123,230,.15);color:#c3aef0;border-color:rgba(156,123,230,.4)">Fluxo automático do agente</span><h3 style="margin:0">${p.name}</h3></div></div>
    <div class="dfn">Preço de mercado ${p.price} · ${p.trend}</div>
    <div class="ostep fade d1"><div class="on">1</div><div class="ob"><h4>Melhor fornecedor</h4><div class="ocard"><b>${p.supplier.name}</b> · ${p.supplier.country}<div class="orow"><span>Preço FOB</span><span>${p.supplier.price}</span></div><div class="orow"><span>Lead time</span><span>${p.supplier.lead}</span></div></div></div></div>
    <div class="ostep fade d2"><div class="on">2</div><div class="ob"><h4>Oferta formada</h4><div class="ocard"><div class="orow"><span>Compra (fornecedor)</span><span>${p.supplier.price}</span></div><div class="orow"><span>Oferta ao cliente</span><span style="color:${C.ice}"><b>${p.price}</b></span></div><div class="orow"><span>Condições</span><span>CFR · mín. 1×40' reefer</span></div><div class="orow"><span>Validade</span><span>5 dias úteis</span></div></div></div></div>
    <div class="ostep fade d3"><div class="on">3</div><div class="ob"><h4>Clientes no CRM · compram ${cat.label}</h4><div class="ocard clist">${cat.clients.map(c=>`<div class="cl"><span>${c.name} · ${c.country}</span><span>${c.last}</span></div>`).join('')}</div></div></div>
    <div class="fade d4" id="sendWrap"><button class="btn" id="sendOffer">Enviar oferta para ${n} clientes</button></div>`;
  $('#scrim').classList.add('on');$('#drawer').classList.add('on');
  $('#sendOffer').onclick=()=>{$('#sendWrap').innerHTML=`<div class="osuccess">✓ Oferta enviada para ${n} clientes via CRM<span>Registrada no funil comercial · follow-up agendado</span></div>`;};
}
function intakeView(){
  const agentOpts=['—'].concat(AGENTS.map(a=>a.name)).map(n=>`<option>${n}</option>`).join('');
  const secOpts=SECTORS.filter(s=>s.id!=='overview').map(s=>`<option>${s.name}</option>`).join('');
  return `<header class="topbar fade"><div><div class="title">Acesso a Projetos e Inteligência</div><div class="desc">Reporte falhas, lentidão ou proponha novos agentes. Anexe prints e documentos — vira fila de evolução da plataforma.</div></div><span class="proto">protótipo · dados ilustrativos</span></header>
    <div class="intake-grid fade d1">
      <div class="form">
        <h3>Novo registro</h3><div class="sub">Sua observação alimenta a evolução dos agentes.</div>
        <div class="field"><label>Tipo</label><select id="f-kind"><option>Falha em agente</option><option>Ideia de novo agente</option><option>Lentidão de resposta</option><option>Outro</option></select></div>
        <div class="field"><label>Agente relacionado</label><select id="f-agent">${agentOpts}</select></div>
        <div class="field"><label>Setor</label><select id="f-sector">${secOpts}</select></div>
        <div class="field"><label>Descrição</label><textarea id="f-desc" placeholder="Descreva o que aconteceu ou a ideia..."></textarea></div>
        <div class="field"><label>Anexos (PDF ou imagem)</label>
          <div class="drop" id="drop"><b>Clique para anexar</b> ou arraste PDFs e imagens aqui</div>
          <input type="file" id="f-files" accept=".pdf,image/*" multiple style="display:none">
          <div class="chips" id="fchips"></div>
        </div>
        <button class="btn" id="submit">Registrar</button>
      </div>
      <div class="queue"><h3>Fila de registros <span style="color:var(--ink-3);font-weight:400" id="qcount"></span></h3><div id="queue"></div></div>
    </div>`;
}

function renderAgents(){
  const sec=SECTORS.find(s=>s.id===view);
  let list=view==='overview'?AGENTS.slice():AGENTS.filter(a=>a.s===view);
  if(filter!=='all')list=list.filter(a=>a.tier===filter);
  const ctx=$('#ctx');if(ctx)ctx.textContent=`${list.length} agente${list.length!==1?'s':''} nesta visão`;
  $('#agents').innerHTML=list.map(a=>`<div class="agent" data-i="${AGENTS.indexOf(a)}"><span class="badge ${a.tier}">${a.tier==='a'?'● Ativo':a.tier==='b'?'● Em dev.':'● Planejado'}</span>${avatar(a.ic,SCOLOR[a.s])}<div class="name">${a.name}</div><div class="fn">${a.fn}</div>${starRow(a.stars)}<div class="slabel">treinamento e acertos</div></div>`).join('')||`<div style="color:var(--ink-3);font-size:13px;padding:20px">Nenhum agente neste filtro.</div>`;
  document.querySelectorAll('.agent').forEach(el=>el.onclick=()=>openDrawer(+el.dataset.i));
}
function renderQueue(){
  $('#queue').innerHTML=intakeItems.map(it=>{
    const st=it.status==='rev'?'rev':it.status==='done'?'done':'';
    const stTxt=it.status==='rev'?'Em análise':it.status==='done'?'Resolvido':'Aberto';
    const att=it.files.length?`<span class="att">◈ ${it.files.length} anexo${it.files.length>1?'s':''}: ${it.files.join(', ')}</span>`:'<span>sem anexo</span>';
    return `<div class="item"><div class="ih"><span class="kind">${it.kind}</span><span class="st ${st}">${stTxt}</span></div><p>${it.desc}</p><div class="im"><span>Agente: ${it.agent}</span><span>Setor: ${it.sector}</span>${att}<span>${it.when}</span></div></div>`;
  }).join('');
  $('#qcount').textContent=`(${intakeItems.length})`;
}

function bindDashboard(){
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');filter=c.dataset.f;renderAgents();});
  renderAgents();
}
function bindIntake(){
  const inp=$('#f-files');
  $('#drop').onclick=()=>inp.click();
  inp.onchange=()=>{pendingFiles=pendingFiles.concat([...inp.files].map(f=>f.name));renderChips();inp.value='';};
  function renderChips(){$('#fchips').innerHTML=pendingFiles.map((n,i)=>`<span class="fchip">◈ ${n} <b data-r="${i}">×</b></span>`).join('');
    document.querySelectorAll('#fchips b').forEach(b=>b.onclick=()=>{pendingFiles.splice(+b.dataset.r,1);renderChips();});}
  $('#submit').onclick=()=>{
    const desc=$('#f-desc').value.trim();if(!desc){$('#f-desc').style.borderColor=C.ice;$('#f-desc').focus();return;}
    intakeItems.unshift({kind:$('#f-kind').value,agent:$('#f-agent').value,sector:$('#f-sector').value,desc,files:pendingFiles.slice(),status:'open',when:'agora'});
    pendingFiles=[];render();
  };
  renderQueue();
}
function openDrawer(i){
  const a=AGENTS[i],sector=SECTORS.find(s=>s.id===a.s).name;
  const tf={a:'Ativo — Trilha A (opera sobre dado bruto)',b:'Em desenvolvimento — Trilha B (exige dado estruturado)',p:'Planejado — fase posterior'};
  $('#drawerBody').innerHTML=`<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">${avatar(a.ic,SCOLOR[a.s])}<div><span class="badge ${a.tier}" style="display:inline-block;margin-bottom:6px">${tf[a.tier]}</span><h3 style="margin:0">${a.name}</h3></div></div><div class="dfn">${a.fn}</div>
    <div class="drow"><span class="k">Setor</span><span class="v">${sector}</span></div><div class="drow"><span class="k">Fonte de dados</span><span class="v">${a.src}</span></div><div class="drow"><span class="k">Treinamento e acertos</span><span class="v">${starRow(a.stars)}</span></div><div class="drow"><span class="k">Prontidão</span><span class="v">${a.ready}%</span></div>
    <div class="dnote"><b>O que precisa para operar:</b><br>${a.needs}</div>
    ${a.tier==='b'?`<div class="dnote" style="border-color:rgba(232,161,58,.3)"><b style="color:${C.amber}">Depende da fundação de dados.</b> Só entrega número confiável com os campos-alvo padronizados na origem — é a Trilha B.</div>`:''}
    ${a.tier==='a'?`<div class="dnote" style="border-color:rgba(72,180,124,.3)"><b style="color:${C.green}">Pode entrar já.</b> Opera sobre o acervo atual (e-mail, drive, planilha) sem padronização prévia.</div>`:''}`;
  $('#scrim').classList.add('on');$('#drawer').classList.add('on');
}
function closeDrawer(){$('#scrim').classList.remove('on');$('#drawer').classList.remove('on');}

function render(){
  renderNav();
  const m=$('#main');
  if(view==='market'){m.innerHTML=marketView();bindMarket();}
  else if(view==='intake'){m.innerHTML=intakeView();bindIntake();}
  else{m.innerHTML=dashboardView(SECTORS.find(s=>s.id===view));bindDashboard();}
}
$('#closeDrawer').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
render();
</script>
</body>
</html>
